# Tiki T's admin settings (Decap CMS)
# GitHub account: tikitsllc-code
backend:
  name: github
  repo: tikitsllc-code/tiki-ts-website
  branch: main
  commit_messages:
    update: "Update {{slug}} from the admin page"

# Photos you upload in the admin go into the images folder
media_folder: "images"
public_folder: "/images"

site_url: "https://tikits.netlify.app"
display_url: "https://tikits.netlify.app"
logo_url: "/tiki-banner.jpg"

collections:
  - name: "site"
    label: "Edit my website"
    description: "Pick what you want to change. Click Publish at the top when you're done, and your site updates in about a minute."
    editor:
      preview: false
    files:

      # ---------------------------------------------------------------
      - name: "business"
        label: "1. Business info, banner & social links"
        file: "content/business.json"
        format: "json"
        fields:
          - label: "Business name"
            name: "businessName"
            widget: "string"
            hint: "Shows at the bottom of every page."
          - label: "Your email"
            name: "email"
            widget: "string"
            hint: "Quote requests and the Email us links go here."
          - label: "Banner picture"
            name: "banner"
            widget: "image"
            choose_url: false
            hint: "The big picture at the very top of the home page."
          - label: "Buttons under the banner"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Pink button", name: "orderButton", widget: "string" }
              - { label: "Yellow button", name: "emailButton", widget: "string" }
          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Tagline at the bottom", name: "tagline", widget: "string" }
          - label: "Social media links"
            name: "social"
            widget: "object"
            hint: "Paste the full link (starts with https://). Leave a box empty to hide that one."
            fields:
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "Facebook", name: "facebook", widget: "string", required: false }
              - { label: "TikTok", name: "tiktok", widget: "string", required: false }

      # ---------------------------------------------------------------
      - name: "look"
        label: "2. Site colors & fonts"
        file: "content/look.json"
        format: "json"
        fields:
          - { label: "Pink", name: "pink", widget: "color", hint: "Main buttons and accents." }
          - { label: "Yellow", name: "yellow", widget: "color", hint: "Second buttons and highlights." }
          - { label: "Teal", name: "teal", widget: "color", hint: "The T's in the logo and small labels." }
          - { label: "Dark", name: "dark", widget: "color", hint: "Text, outlines and the top bar. Keep this dark so text is easy to read." }
          - { label: "Sand", name: "sand", widget: "color", hint: "The main page background." }
          - { label: "Light blue", name: "lightBlue", widget: "color", hint: "Background of How it works and the FAQ." }
          - { label: "Ocean blue", name: "ocean", widget: "color", hint: "Background of the quote form." }
          - label: "Heading font"
            name: "headingFont"
            widget: "select"
            options: ["Permanent Marker", "Bangers", "Luckiest Guy", "Lilita One", "Rock Salt", "Pacifico", "Titan One", "Bungee"]
            hint: "The big brush-style headings."
          - label: "Text font"
            name: "bodyFont"
            widget: "select"
            options: ["Figtree", "Nunito", "Poppins", "Lato", "Montserrat", "Open Sans", "Rubik"]
            hint: "Everything else."

      # ---------------------------------------------------------------
      - name: "sections"
        label: "3. Turn sections on/off & menu words"
        file: "content/sections.json"
        format: "json"
        fields:
          - label: "Show these sections"
            name: "sections"
            widget: "object"
            hint: "Switch off anything you don't want on the site right now."
            fields:
              - { label: "What we print", name: "whatWePrint", widget: "boolean", default: true }
              - { label: "Starting prices", name: "prices", widget: "boolean", default: true }
              - { label: "How it works", name: "howItWorks", widget: "boolean", default: true }
              - { label: "Reviews", name: "reviews", widget: "boolean", default: true }
              - { label: "Quote form", name: "quote", widget: "boolean", default: true }
              - { label: "FAQ and size chart", name: "faq", widget: "boolean", default: true }
              - { label: "Contact", name: "contact", widget: "boolean", default: true }
              - { label: "Our prints page", name: "ourPrints", widget: "boolean", default: true }
          - label: "Words in the top menu"
            name: "nav"
            widget: "object"
            fields:
              - { label: "Our prints", name: "ourPrints", widget: "string" }
              - { label: "What we print", name: "whatWePrint", widget: "string" }
              - { label: "How it works", name: "howItWorks", widget: "string" }
              - { label: "Get a quote", name: "quote", widget: "string" }
              - { label: "FAQ", name: "faq", widget: "string" }

      # ---------------------------------------------------------------
      - name: "products"
        label: "4. Products (tees, hoodies, bags, cups...)"
        file: "content/products.json"
        format: "json"
        fields:
          - label: "Products"
            name: "items"
            widget: "list"
            label_singular: "product"
            summary: "{{fields.name}}"
            collapsed: true
            hint: "Click a product to open it. Use Add product to make a new one, drag to reorder, or the X to delete."
            fields:
              - { label: "Name", name: "name", widget: "string", hint: "Plural, like T-shirts or Hats." }
              - { label: "Name for just one", name: "singular", widget: "string", hint: "Like shirt or hat. Used in sentences like \"Drag the tiki onto the shirt\"." }
              - { label: "Show this product on the site", name: "show", widget: "boolean", default: true }
              - { label: "Show its card in What we print", name: "showCard", widget: "boolean", default: true }
              - { label: "Card title", name: "cardTitle", widget: "string", required: false }
              - { label: "Card text", name: "cardText", widget: "text", required: false }
              - label: "Picture customers drag their design onto"
                name: "picture"
                widget: "select"
                default: "none"
                options:
                  - { label: "T-shirt", value: "tshirt" }
                  - { label: "Hoodie or jacket", value: "hoodie" }
                  - { label: "Bag", value: "bag" }
                  - { label: "Cup (no picture, spot buttons only)", value: "cup" }
                  - { label: "None (spot buttons only)", value: "none" }
              - { label: "Ask for sizes", name: "hasSizes", widget: "boolean", default: false, hint: "Turn on for clothes. Uses the sizes from page 5." }
              - { label: "Ask cotton or polyester", name: "hasMaterial", widget: "boolean", default: false }
              - label: "Print spots"
                name: "printSpots"
                widget: "list"
                hint: "Buttons customers can tap. Front, Back, Left chest, Right chest, Left sleeve, Right sleeve, Back of neck and Hood also have a spot on the picture."
              - label: "This product's colors"
                name: "colors"
                widget: "list"
                label_singular: "color"
                required: false
                collapsed: true
                summary: "{{fields.name}}"
                hint: "Leave empty to use the main color list from page 6."
                fields:
                  - { label: "Color name", name: "name", widget: "string" }
                  - { label: "Color", name: "hex", widget: "color" }
              - { label: "Extra question (optional)", name: "styleLabel", widget: "string", required: false, hint: "Like \"Cup size\" or \"Hat style\". Leave empty for none." }
              - { label: "Example answer for the extra question", name: "stylePlaceholder", widget: "string", required: false }
              - { label: "Example text in the design details box", name: "detailsPlaceholder", widget: "text", required: false }

      # ---------------------------------------------------------------
      - name: "sizes"
        label: "5. Sizes"
        file: "content/sizes.json"
        format: "json"
        fields:
          - label: "Fits"
            name: "fits"
            widget: "list"
            label_singular: "fit"
            summary: "{{fields.name}}"
            collapsed: true
            hint: "Each fit is a choice like Men's, Women's, Kids or Toddler, with its own sizes."
            fields:
              - { label: "Fit name", name: "name", widget: "string" }
              - { label: "Sizes", name: "sizes", widget: "list", hint: "Type sizes separated by commas, like XS, S, M, L, XL, 2XL, 3XL" }

      # ---------------------------------------------------------------
      - name: "colors"
        label: "6. Main color list"
        file: "content/colors.json"
        format: "json"
        fields:
          - label: "Colors"
            name: "colors"
            widget: "list"
            label_singular: "color"
            summary: "{{fields.name}}"
            collapsed: true
            hint: "Used by every product that doesn't have its own colors. X deletes a color, Add color makes a new one."
            fields:
              - { label: "Color name", name: "name", widget: "string" }
              - { label: "Color", name: "hex", widget: "color" }

      # ---------------------------------------------------------------
      - name: "print-options"
        label: "7. Print methods & materials"
        file: "content/print-options.json"
        format: "json"
        fields:
          - label: "Print methods"
            name: "methods"
            widget: "list"
            label_singular: "print method"
            summary: "{{fields.name}}"
            collapsed: true
            hint: "A \"Not sure\" choice is always added at the end."
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Short description", name: "description", widget: "text", required: false }
          - label: "Materials"
            name: "materialOptions"
            widget: "list"
            label_singular: "material"
            summary: "{{fields.name}}"
            collapsed: true
            hint: "A \"Not sure\" choice is always added at the end."
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Short description", name: "description", widget: "text", required: false }

      # ---------------------------------------------------------------
      - name: "prices"
        label: "8. Starting prices"
        file: "content/prices.json"
        format: "json"
        fields:
          - label: "Prices"
            name: "prices"
            widget: "list"
            label_singular: "price"
            required: false
            summary: "{{fields.item}}: {{fields.price}}"
            collapsed: true
            hint: "Leave empty and the prices section stays hidden."
            fields:
              - { label: "Item", name: "item", widget: "string", hint: "Like T-shirts" }
              - { label: "Price", name: "price", widget: "string", hint: "Like From $15" }
              - { label: "Small note", name: "note", widget: "string", required: false, hint: "Like 12+ shirts get a discount" }
          - label: "Heading and note"
            name: "pricing"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Note under the prices", name: "note", widget: "text", required: false, hint: "Like: Minimum order 6 pieces. Final price depends on colors and print size." }

      # ---------------------------------------------------------------
      - name: "reviews"
        label: "9. Customer reviews"
        file: "content/reviews.json"
        format: "json"
        fields:
          - label: "Reviews"
            name: "reviews"
            widget: "list"
            label_singular: "review"
            required: false
            summary: "{{fields.name}}"
            collapsed: true
            hint: "Leave empty and the reviews section stays hidden."
            fields:
              - { label: "What they said", name: "quote", widget: "text" }
              - { label: "Their name", name: "name", widget: "string", required: false, hint: "Like Maria G." }
              - { label: "Stars (1 to 5)", name: "stars", widget: "number", value_type: "int", min: 1, max: 5, default: 5, required: false }
          - label: "Section heading"
            name: "reviewsSection"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }

      # ---------------------------------------------------------------
      - name: "faq"
        label: "10. FAQ & size chart"
        file: "content/faq.json"
        format: "json"
        fields:
          - label: "Questions and answers"
            name: "faq"
            widget: "list"
            label_singular: "question"
            required: false
            summary: "{{fields.question}}"
            collapsed: true
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }
          - label: "FAQ heading"
            name: "faqSection"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
          - label: "Size chart picture"
            name: "sizeChart"
            widget: "image"
            required: false
            choose_url: false
            hint: "Upload your supplier's size chart. Leave empty to hide it."
          - { label: "Note above the size chart", name: "sizeChartNote", widget: "text", required: false }
          - label: "Size chart heading"
            name: "sizeChartSection"
            widget: "object"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }

      # ---------------------------------------------------------------
      - name: "gallery"
        label: "11. Our prints photos"
        file: "content/gallery.json"
        format: "json"
        fields:
          - label: "Photos"
            name: "gallery"
            widget: "list"
            label_singular: "photo"
            summary: "{{fields.name}}"
            collapsed: true
            hint: "Add photo to post a shirt, hoodie, bag or cup you made."
            fields:
              - { label: "Photo", name: "photo", widget: "image", required: false, choose_url: false }
              - { label: "Name under the photo", name: "name", widget: "string", hint: "Like Reyes family reunion" }
              - label: "Product type"
                name: "kind"
                widget: "relation"
                collection: "site"
                file: "products"
                search_fields: ["items.*.name"]
                value_field: "items.*.name"
                display_fields: ["items.*.name"]
                hint: "Used for the filter buttons on the Our prints page."
          - label: "Page wording"
            name: "prints"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - { label: "\"All\" filter button", name: "allLabel", widget: "string" }
              - { label: "Text above the bottom button", name: "ctaText", widget: "string" }
              - { label: "Bottom button", name: "ctaButton", widget: "string" }

      # ---------------------------------------------------------------
      - name: "page-text"
        label: "12. Home page wording"
        file: "content/page-text.json"
        format: "json"
        fields:
          - label: "What we print section"
            name: "whatWePrint"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - { label: "\"Great for\" label", name: "greatForLabel", widget: "string" }
              - { label: "Great for...", name: "greatFor", widget: "text" }
          - label: "How it works section"
            name: "howItWorks"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
          - label: "How it works steps"
            name: "steps"
            widget: "list"
            label_singular: "step"
            summary: "{{fields.title}}"
            collapsed: true
            fields:
              - { label: "Step title", name: "title", widget: "string" }
              - { label: "Step text", name: "text", widget: "text" }
          - label: "Contact section"
            name: "contact"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - { label: "Label next to the email", name: "emailLabel", widget: "string" }

      # ---------------------------------------------------------------
      - name: "quote-form"
        label: "13. Quote form wording"
        file: "content/quote-form.json"
        format: "json"
        fields:
          - label: "Top of the quote form"
            name: "quote"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - { label: "Timing label", name: "timingLabel", widget: "string" }
              - { label: "Timing note", name: "timingNote", widget: "text" }
          - label: "\"What's it for?\" choices"
            name: "purposes"
            widget: "list"
            label_singular: "choice"
            collapsed: true
          - label: "\"Do you have artwork?\" choices"
            name: "artOptions"
            widget: "list"
            label_singular: "choice"
            collapsed: true
          - label: "Every other label and message"
            name: "form"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Name box label", name: "nameLabel", widget: "string" }
              - { label: "Contact box label", name: "contactLabel", widget: "string" }
              - { label: "\"What's it for?\" label", name: "purposeLabel", widget: "string" }
              - { label: "Products question", name: "itemsQuestion", widget: "string" }
              - { label: "Products tip", name: "itemsHint", widget: "text" }
              - { label: "Upload label", name: "uploadLabel", widget: "string" }
              - { label: "Upload tip", name: "uploadHint", widget: "text" }
              - { label: "Order lines question (with sizes)", name: "linesQuestionSized", widget: "string" }
              - { label: "Order lines question (no sizes)", name: "linesQuestion", widget: "string" }
              - { label: "Sizes example", name: "sizesHint", widget: "text" }
              - { label: "Size chart link", name: "sizeChartLink", widget: "string" }
              - { label: "Add line button", name: "addLine", widget: "string" }
              - { label: "\"Other color\" choice", name: "otherColor", widget: "string" }
              - { label: "Print spot question (with picture)", name: "spotsQuestion", widget: "text" }
              - { label: "Print spot question (no picture)", name: "spotsQuestionNoPicture", widget: "string" }
              - { label: "Print method label", name: "methodLabel", widget: "string" }
              - { label: "Material label", name: "materialLabel", widget: "string" }
              - { label: "\"Not sure\" title", name: "notSureTitle", widget: "string" }
              - { label: "\"Not sure\" text for print method", name: "notSureMethod", widget: "string" }
              - { label: "\"Not sure\" text for material", name: "notSureMaterial", widget: "string" }
              - { label: "Sublimation on cotton warning", name: "sublimationWarning", widget: "text" }
              - { label: "Design details label", name: "detailsLabel", widget: "string" }
              - { label: "Artwork question", name: "artQuestion", widget: "string" }
              - { label: "Missing info message", name: "missingMessage", widget: "text" }
              - { label: "Review button", name: "reviewButton", widget: "string" }
              - { label: "Review heading", name: "reviewHeading", widget: "string" }
              - { label: "Send button", name: "sendButton", widget: "string" }
              - { label: "Note under Send", name: "sendHint", widget: "text" }
              - { label: "Sent message", name: "sentMessage", widget: "text" }
